# Tag release — Tauri 2 only (Electron packaging removed)

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  shipping-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/writing-vue/package-lock.json
      - name: Install frontend deps
        run: npm --prefix apps/writing-vue ci --no-fund --no-audit
      - uses: Swatinem/rust-cache@v2
      - name: Tauri + Vue static gate
        run: python developer/tests/ci/run_static_suite.py
      - name: Install Tauri WebDriver tooling
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo install tauri-driver --locked
      - uses: browser-actions/setup-edge@v1
      - uses: browser-actions/setup-edgedriver@v1
      - name: Build packaged Tauri application
        run: cargo tauri build --no-bundle
      - name: Packaged Tauri WebView gate
        shell: pwsh
        run: |
          $env:TAURI_APP_BINARY = (Resolve-Path target/release/ielts-practice-tauri.exe)
          $env:TAURI_NATIVE_DRIVER = (Get-Command msedgedriver).Source
          python developer/tests/e2e/suite_practice_flow.py
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: |
            developer/tests/e2e/reports/static-ci-report.json
            developer/tests/e2e/reports/suite-practice-flow-report.json

  rust-test:
    needs: shipping-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Domain + DB tests
        run: cargo test -p ielts-domain -p ielts-db

  tauri-release:
    needs: rust-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/writing-vue/package-lock.json
      - name: Install frontend deps
        run: npm --prefix apps/writing-vue ci --no-fund --no-audit
      - name: Build frontend
        run: npm --prefix apps/writing-vue run build
      - uses: Swatinem/rust-cache@v2
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Tauri build
        run: cargo tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify non-empty Tauri bundle
        run: python developer/tests/ci/verify_tauri_bundle.py --report developer/tests/e2e/reports/tauri-bundle-${{ matrix.platform }}.json
      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}
          path: |
            target/**/release/bundle/**
            developer/tests/e2e/reports/tauri-bundle-${{ matrix.platform }}.json
          if-no-files-found: error
