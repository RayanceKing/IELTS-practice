[package]
name = "ielts-application"
version = "0.1.0"
edition = "2021"
description = "Application use cases for IELTS Practice"
publish = false

[dependencies]
async-trait = "0.1"
ielts-domain = { path = "../ielts-domain" }
ielts-db = { path = "../ielts-db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
